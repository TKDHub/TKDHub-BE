name: Deploy to Hetzner

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy stack via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, rebuild, and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            set -e
            cd /opt/tkdhub
            git fetch origin master
            git reset --hard origin/master
            docker compose build
            docker compose up -d --remove-orphans
          '

      - name: Verify health
        run: |
          sleep 10
          curl -sf "http://${{ secrets.HETZNER_HOST }}:8080/health" | grep -qi healthy
          curl -sf "http://${{ secrets.HETZNER_HOST }}:8081/health" | grep -qi healthy
          echo "Both services healthy after deploy."
