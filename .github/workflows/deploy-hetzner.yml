name: Deploy to Hetzner

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy stack via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull, rebuild, and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            set -e
            cd /opt/tkdhub
            git fetch origin master
            git reset --hard origin/master
            docker compose build
            docker compose up -d --remove-orphans
          '

      - name: Verify health
        run: |
          for i in $(seq 1 12); do
            if curl -sf "https://dojo.167-235-252-229.sslip.io/health" | grep -qi healthy \
              && curl -sf "https://identity.167-235-252-229.sslip.io/health" | grep -qi healthy; then
              echo "Both services healthy over HTTPS."
              exit 0
            fi
            echo "Not ready yet (attempt $i/12) — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after retries."
          exit 1
